<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КУРОВОЗ — доставка куриц под контролем</title>
<meta name="description" content="КУРОВОЗ — рабочая станция для заказа, перевозки и приёмки куриц: клиент, перевозчик и чистка (цех) в одном окне.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0D0E'/%3E%3Cpath d='M6 22h20M8 22V12l8-6 8 6v10' stroke='%23FFB000' stroke-width='2.4' fill='none'/%3E%3Ccircle cx='16' cy='15' r='2.4' fill='%23FFB000'/%3E%3C/svg%3E">
<style>
/* ============================================================
   КУРОВОЗ — Night Dispatch
   tokens
   ============================================================ */
:root{
  --canvas:#0B0D0E;
  --surface-1:#111516;
  --surface-2:#171D1E;
  --surface-3:#20292A;
  --ink:#F2EDE3;
  --ink-muted:#9AA5A1;
  --ink-faint:#66726F;
  --border:#2C3737;
  --border-active:#697873;
  --voltage:#FFB000;
  --voltage-soft:#3A2A08;
  --voltage-hover:#FFC23D;
  --success:#59C98A;
  --success-soft:#173226;
  --danger:#FF6B5F;
  --danger-soft:#42211F;
  --on-voltage:#0B0D0E;
  --delivery:#4EA1D3;

  --font-display:"Barlow Condensed", "Inter", system-ui, sans-serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --rail-w:240px;
  --util-h:72px;
  --gutter:32px;
  --ease-out:cubic-bezier(0.22, 1, 0.36, 1);
  --ease-stamp:cubic-bezier(0.34, 1.56, 0.64, 1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--voltage);color:var(--on-voltage);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
input,select,textarea{font-family:inherit;color:inherit;}
img,svg{display:block;}
ul{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
:focus-visible{outline:2px solid var(--voltage);outline-offset:2px;}

/* ---------- type ---------- */
.t-display{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(42px, 5.2vw, 72px);
  line-height:0.93;
  letter-spacing:0.01em;
  text-transform:uppercase;
}
.t-display-sm{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(34px, 3.4vw, 48px);
  line-height:0.95;
  letter-spacing:0.01em;
  text-transform:uppercase;
}
.t-heading{font-weight:700;font-size:22px;line-height:1.1;letter-spacing:0.01em;}
.t-heading-sm{font-weight:700;font-size:17px;line-height:1.2;}
.t-label{
  font-size:11px;font-weight:700;line-height:1.2;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-muted);
}
.t-label-amber{color:var(--voltage);}
.t-body{font-size:15px;line-height:1.45;color:var(--ink-muted);}
.t-strong{font-size:15px;font-weight:600;line-height:1.35;}
.t-data{font-family:var(--font-data);font-weight:500;font-variant-numeric:tabular-nums;}
.t-data-lg{font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums;font-size:18px;line-height:1.2;}
.t-metric{
  font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:clamp(48px, 5vw, 68px);line-height:0.95;letter-spacing:-0.02em;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:52px;padding:0 24px;border-radius:8px;
  font-size:15px;font-weight:600;line-height:1;
  transition:background 150ms ease, border-color 150ms ease, transform 120ms ease, color 150ms ease;
  min-width:44px;
}
.btn:active{transform:translateY(1px);transition-duration:80ms;}
.btn-primary{background:var(--voltage);color:var(--on-voltage);}
.btn-primary:hover{background:var(--voltage-hover);}
.btn-secondary{height:48px;border:1px solid var(--border-active);color:var(--ink);background:transparent;}
.btn-secondary:hover{background:var(--surface-2);}
.btn-danger{height:48px;border:1px solid var(--danger);color:var(--danger);background:transparent;}
.btn-danger:hover{background:var(--danger-soft);}
.btn-ghost{height:44px;padding:0 12px;color:var(--ink-muted);border-radius:8px;}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2);}
.btn-block{width:100%;}
.btn svg{flex:none;}
.btn-accept-zone{
  width:100%;min-height:56px;background:var(--voltage);color:var(--on-voltage);
  border-radius:8px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background 150ms ease, transform 120ms ease;
}
.btn-accept-zone:hover{background:var(--voltage-hover);}
.btn-accept-zone:active{transform:translateY(1px);}
.btn:disabled,.btn-accept-zone:disabled{opacity:0.45;cursor:not-allowed;}
.btn-link{
  color:var(--voltage);font-size:13px;font-weight:600;
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.btn-link:hover{border-bottom-color:var(--voltage);}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  white-space:nowrap;
}
.badge-new{background:var(--voltage-soft);color:var(--voltage);}
.badge-ok{background:var(--success-soft);color:var(--success);}
.badge-alert{background:var(--danger-soft);color:var(--danger);}
.badge-muted{background:var(--surface-3);color:var(--ink-muted);}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:8px;}
.field .hint{font-size:12px;color:var(--ink-faint);line-height:1.35;}
.field .err{font-size:12px;color:var(--danger);line-height:1.35;min-height:0;}
.input, .select, .textarea{
  height:48px;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;
  padding:0 14px;font-size:15px;color:var(--ink);width:100%;
  transition:border-color 150ms ease, box-shadow 150ms ease;
}
.textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.45;}
.input::placeholder,.textarea::placeholder{color:var(--ink-faint);}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--voltage);box-shadow:0 0 0 2px rgba(255,176,0,0.35);
}
.input[readonly]{color:var(--ink-muted);background:var(--surface-2);}
.input-num{font-family:var(--font-data);font-variant-numeric:tabular-nums;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.field-group{display:flex;flex-direction:column;gap:20px;}
.suffix-wrap{position:relative;}
.suffix-wrap .suffix{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-family:var(--font-data);font-size:14px;color:var(--ink-muted);pointer-events:none;
}
.suffix-wrap .input{padding-right:38px;}

/* ---------- surfaces ---------- */
.panel{background:var(--surface-1);border:1px solid var(--border);padding:24px;}
.panel-flush{padding:0;}
.card{background:var(--surface-1);border:1px solid var(--border);padding:20px;transition:border-color 150ms ease;}
.card:hover{border-color:var(--border-active);}
.card.is-selected{border-left:3px solid var(--voltage);}
.divider{height:1px;background:var(--border);border:0;margin:0;}

/* ============================================================
   ENTRY (registration / login)
   ============================================================ */
.entry{min-height:100vh;display:flex;flex-direction:column;}
.entry-bar{
  height:var(--util-h);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--gutter);flex:none;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border:1px solid var(--voltage);display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-name{
  font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.04em;line-height:1;
  text-transform:uppercase;
}
.brand-name em{font-style:normal;color:var(--voltage);}
.entry-main{
  flex:1;display:grid;grid-template-columns:5fr 7fr;
  max-width:1440px;width:100%;margin:0 auto;
}
.entry-copy{
  padding:48px var(--gutter) 48px var(--gutter);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:32px;
}
.entry-map-wrap{
  padding:24px var(--gutter) 24px 24px;display:flex;flex-direction:column;gap:16px;min-width:0;
}
.entry-role-marks{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border);}
.role-mark{
  display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border);
}
.role-mark .rm-icon{
  width:40px;height:40px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--voltage);flex:none;
}
.role-mark h3{font-size:15px;font-weight:700;margin-bottom:2px;}
.entry-actions{display:flex;flex-direction:column;gap:16px;align-items:flex-start;}

/* stepper */
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.step{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);
}
.step .sn{
  width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-data);font-size:11px;
}
.step.is-active{color:var(--voltage);}
.step.is-active .sn{border-color:var(--voltage);background:var(--voltage-soft);}
.step.is-done{color:var(--success);}
.step.is-done .sn{border-color:var(--success);background:var(--success-soft);}
.step-sep{width:18px;height:1px;background:var(--border);flex:none;}

.reg-card{background:var(--surface-1);border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:20px;}
.code-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.mock-code{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--voltage-soft);color:var(--voltage);border:1px solid rgba(255,176,0,0.35);
  font-family:var(--font-data);font-size:14px;font-weight:600;
}
.role-select-list{display:flex;flex-direction:column;gap:12px;}
.role-option{
  display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;
  padding:16px;border:1px solid var(--border);background:var(--surface-1);
  transition:border-color 150ms ease, background 150ms ease;
}
.role-option:hover{border-color:var(--border-active);background:var(--surface-2);}
.role-option.is-on{border-color:var(--voltage);background:var(--voltage-soft);}
.role-option .ro-icon{
  width:44px;height:44px;border:1px solid var(--border);color:var(--voltage);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.role-option.is-on .ro-icon{border-color:var(--voltage);}
.role-option .ro-title{font-weight:700;font-size:15px;}
.role-option .ro-desc{font-size:13px;color:var(--ink-muted);margin-top:2px;}

/* ============================================================
   SHELL (app)
   ============================================================ */
.shell{min-height:100vh;}
.rail{
  position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);
  background:var(--surface-1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:24px;z-index:40;
}
.rail-role{
  margin-top:24px;padding:12px;border:1px solid var(--border);background:var(--canvas);
  display:flex;flex-direction:column;gap:6px;
}
.rail-role .rr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rail-nav{margin-top:32px;display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;
  font-size:13px;font-weight:600;color:var(--ink-muted);border-left:3px solid transparent;
  transition:color 150ms ease, background 150ms ease, border-color 150ms ease;
  width:100%;text-align:left;
}
.nav-item:hover{color:var(--ink);background:var(--surface-2);}
.nav-item.is-active{color:var(--ink);border-left-color:var(--voltage);background:var(--surface-2);}
.nav-item.is-active svg{color:var(--voltage);}
.nav-item .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--voltage);margin-left:auto;}
.rail-foot{display:flex;flex-direction:column;gap:8px;}
.role-switch{
  display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--border);background:var(--canvas);
}
.role-switch .rs-btn{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;font-size:12px;font-weight:600;
  color:var(--ink-muted);text-align:left;
}
.role-switch .rs-btn:hover{background:var(--surface-2);color:var(--ink);}
.role-switch .rs-btn.is-on{background:var(--voltage-soft);color:var(--voltage);}

.utilbar{
  position:fixed;top:0;left:var(--rail-w);right:0;height:var(--util-h);
  background:var(--canvas);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 var(--gutter);z-index:35;
}
.util-left{display:flex;align-items:center;gap:16px;min-width:0;}
.util-right{display:flex;align-items:center;gap:12px;}
.util-role{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border);
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--voltage);
}
.icon-btn{
  width:44px;height:44px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--ink-muted);position:relative;transition:color 150ms ease, border-color 150ms ease, background 150ms ease;
}
.icon-btn:hover{color:var(--ink);border-color:var(--border-active);background:var(--surface-2);}
.icon-btn .unread{
  position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--voltage);
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border-active);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink);flex:none;
}
.util-user{display:flex;align-items:center;gap:10px;min-width:0;}
.util-user .uu-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.util-user .uu-phone{font-family:var(--font-data);font-size:12px;color:var(--ink-muted);}

.main{
  margin-left:var(--rail-w);padding:calc(var(--util-h) + 48px) var(--gutter) 64px;
  max-width:1440px;
}
.work-grid{display:grid;grid-template-columns:5fr 7fr;gap:var(--gutter);align-items:start;}
.work-grid > .col{min-width:0;}
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
.page-head .ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.section{margin-top:48px;}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);
}

/* order cards */
.order-list{display:flex;flex-direction:column;gap:16px;}
.order-card{display:flex;flex-direction:column;gap:16px;}
.order-card .oc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.order-card .oc-id{font-family:var(--font-data);font-size:14px;color:var(--ink-muted);}
.order-card .oc-title{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;text-transform:uppercase;}
.order-card .oc-sub{font-family:var(--font-data);font-size:14px;color:var(--ink-muted);}
.route-row{display:flex;align-items:stretch;gap:12px;}
.route-line{width:2px;background:var(--border);position:relative;flex:none;margin:6px 0;}
.route-line::before,.route-line::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);width:8px;height:8px;
}
.route-line::before{top:0;background:var(--voltage);}
.route-line::after{bottom:0;border:1.5px solid var(--ink-muted);}
.route-points{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0;}
.route-points .rp-item{min-width:0;}
.route-points .rp-val{font-size:14px;line-height:1.3;}
.meta-grid{
  display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:12px 0;
}
.meta-grid .mg-item{display:flex;flex-direction:column;gap:4px;min-width:0;}
.meta-grid .mg-val{font-family:var(--font-data);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.meta-grid .mg-val.accent{color:var(--voltage);}
.oc-actions{display:flex;gap:12px;flex-wrap:wrap;}
.oc-actions .btn{flex:1;min-width:160px;}

.person-row{
  display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface-2);border:1px solid var(--border);
  flex-wrap:wrap;
}
.person-row .pr-main{display:flex;flex-direction:column;gap:2px;min-width:140px;flex:1;}
.person-row .pr-name{font-size:14px;font-weight:600;}
.person-row .pr-phone{font-family:var(--font-data);font-size:13px;color:var(--ink-muted);}
.reqs{width:100%;margin-top:4px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.reqs .rq-row{display:flex;gap:12px;font-size:13px;flex-wrap:wrap;}
.reqs .rq-k{color:var(--ink-faint);min-width:96px;}
.reqs .rq-v{font-family:var(--font-data);color:var(--ink);}

/* metric band */
.metric-band{
  display:grid;grid-template-columns:repeat(3, 1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);margin-bottom:32px;
}
.metric-cell{background:var(--surface-1);padding:24px;display:flex;flex-direction:column;gap:8px;min-width:0;}
.metric-cell .mc-num{color:var(--ink);}
.metric-cell .mc-num.accent{color:var(--voltage);}
.metric-cell .mc-num small{font-size:0.42em;color:var(--ink-muted);margin-left:6px;font-weight:500;}

/* map */
.map-frame{
  border:1px solid var(--border);background:var(--surface-1);padding:16px;display:flex;flex-direction:column;gap:12px;
}
.map-frame .map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.map-svg-wrap{position:relative;width:100%;overflow:hidden;background:var(--surface-1);}
.map-svg-wrap svg{width:100%;height:auto;display:block;}
.status-strip{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--border);background:var(--surface-2);padding:12px 14px;
}
.status-strip .ss-live{
  display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--voltage);
}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--voltage);position:relative;flex:none;}
.pulse-dot::after{
  content:"";position:absolute;inset:-4px;border:1px solid var(--voltage);border-radius:50%;
  animation:pulseRing 2200ms ease-out infinite;
}
@keyframes pulseRing{
  0%{transform:scale(0.5);opacity:0.9;}
  70%{transform:scale(1.8);opacity:0;}
  100%{opacity:0;}
}
.eta-module{
  border-top:1px solid var(--border);padding-top:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.eta-num{
  font-family:var(--font-data);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:clamp(40px, 4vw, 56px);line-height:0.95;color:var(--voltage);
}
.eta-module .eta-side{display:flex;flex-direction:column;gap:4px;text-align:right;}
.eta-module .eta-side .es-val{font-family:var(--font-data);font-size:15px;font-weight:600;}
.eta-locked{animation:etaLock 220ms var(--ease-out);}
@keyframes etaLock{from{transform:scale(0.96);opacity:0.6;}to{transform:scale(1);opacity:1;}}

.map-legend{display:flex;gap:16px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);}
.legend-swatch{width:12px;height:12px;flex:none;}

.drawer-backdrop{

  display:flex;flex-direction:column;
  animation:slideIn 240ms var(--ease-out);
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideIn{from{transform:translateX(16px);opacity:0;}to{transform:none;opacity:1;}}
.drawer-head{
  height:var(--util-h);border-bottom:1px solid var(--border);padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;
}
.drawer-body{flex:1;overflow:auto;}
.notif-row{
  display:flex;flex-direction:column;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border);
  border-left:3px solid transparent;
}
.notif-row.is-unread{border-left-color:var(--voltage);background:var(--surface-2);}
.notif-row .nr-text{font-size:14px;line-height:1.4;}
.notif-row .nr-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.notif-row .nr-time{font-family:var(--font-data);font-size:12px;color:var(--ink-faint);}
.drawer-foot{border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:12px;}
.empty{
  border:1px dashed var(--border);padding:32px 24px;text-align:center;color:var(--ink-muted);
  display:flex;flex-direction:column;gap:8px;align-items:center;
}

/* chat */
.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:1px;background:var(--border);border:1px solid var(--border);min-height:560px;}
.chat-list{background:var(--surface-1);display:flex;flex-direction:column;}
.chat-list-head{padding:16px;border-bottom:1px solid var(--border);}
.chat-conv{
  display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-bottom:1px solid var(--border);
  text-align:left;width:100%;border-left:3px solid transparent;
}
.chat-conv:hover{background:var(--surface-2);}
.chat-conv.is-on{background:var(--surface-2);border-left-color:var(--voltage);}
.chat-conv .cc-title{font-size:13px;font-weight:600;}
.chat-conv .cc-sub{font-family:var(--font-data);font-size:11px;color:var(--ink-muted);}
.chat-main{background:var(--canvas);display:flex;flex-direction:column;min-width:0;}
.chat-head{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.chat-context{
  padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface-1);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.chip{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;background:var(--voltage-soft);
  color:var(--voltage);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:520px;}
.msg{max-width:72%;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.msg.mine{background:var(--surface-2);align-self:flex-end;}
.msg.theirs{background:transparent;border:1px solid var(--border);align-self:flex-start;}
.msg .m-text{font-size:14px;line-height:1.45;}
.msg .m-meta{display:flex;gap:10px;align-items:center;font-family:var(--font-data);font-size:11px;color:var(--ink-faint);}
.chat-compose{border-top:1px solid var(--border);padding:16px 20px;display:flex;gap:12px;align-items:flex-end;}
.chat-compose .textarea{min-height:48px;max-height:120px;}
.chat-compose .btn{height:48px;flex:none;}

/* profile */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);align-items:start;}
.kv-list{display:flex;flex-direction:column;gap:0;}
.kv{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.kv:last-child{border-bottom:0;}
.kv .kv-k{color:var(--ink-muted);font-size:13px;}
.kv .kv-v{font-family:var(--font-data);font-size:15px;font-weight:600;text-align:right;}
.kv .kv-v.wrap{text-align:right;}

/* bottom nav (mobile) */
.bottomnav{
  display:none;position:fixed;left:0;right:0;bottom:0;height:64px;z-index:50;
  background:var(--surface-1);border-top:1px solid var(--border);
}
.bottomnav .bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-muted);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
}
.bottomnav .bn-item.is-active{color:var(--voltage);}

/* toast */
.toast-root{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:12px;max-width:360px;}
.toast{
  background:var(--surface-2);border:1px solid var(--border-active);padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;
  animation:toastIn 280ms var(--ease-out);
}
.toast.t-ok{border-left:3px solid var(--success);}
.toast.t-alert{border-left:3px solid var(--danger);}
.toast.t-live{border-left:3px solid var(--voltage);}
.toast .ts-text{font-size:13px;line-height:1.4;}
@keyframes toastIn{from{transform:translateX(16px);opacity:0;}to{transform:none;opacity:1;}}

/* stamps & animations */
.stamp{animation:stampIn 240ms var(--ease-stamp);}
@keyframes stampIn{from{transform:scale(0.85) rotate(-3deg);opacity:0;}to{transform:none;opacity:1;}}
.intake{animation:intake 280ms var(--ease-out) both;}
@keyframes intake{from{transform:translateX(16px);opacity:0;}to{transform:none;opacity:1;}}
.intake-1{animation-delay:0ms;}
.intake-2{animation-delay:70ms;}
.intake-3{animation-delay:140ms;}

.route-path{
  stroke:var(--voltage);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
}
.route-path-anim{
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:drawRoute 900ms var(--ease-out) forwards;
}
@keyframes drawRoute{to{stroke-dashoffset:0;}}
.truck-marker{transition:transform 900ms linear;}

.dialog-wrap{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;

}
.dialog{
  background:var(--surface-1);border:1px solid var(--border);padding:24px;width:100%;max-width:440px;
  display:flex;flex-direction:column;gap:20px;
}
.dialog-actions{display:flex;gap:12px;flex-wrap:wrap;}
.dialog-actions .btn{flex:1;min-width:140px;}

.mobile-top{display:none;}
.menu-sheet{
  position:fixed;inset:0;z-index:65;background:rgba(0,0,0,0.55);
}
.menu-sheet .ms-panel{
  position:absolute;top:0;left:0;right:0;bottom:64px;background:var(--surface-1);
  border-bottom:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:16px;overflow:auto;
  animation:slideDown 240ms var(--ease-out);
}
@keyframes slideDown{from{transform:translateY(-12px);opacity:0;}to{transform:none;opacity:1;}}

/* helpers */
.row{display:flex;align-items:center;gap:12px;}
.row-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;}
.gap-4{gap:4px;}.gap-8{gap:8px;}.gap-12{gap:12px;}.gap-16{gap:16px;}.gap-24{gap:24px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}.mt-24{margin-top:24px;}
.muted{color:var(--ink-muted);}
.faint{color:var(--ink-faint);}
.amber{color:var(--voltage);}
.green{color:var(--success);}
.red{color:var(--danger);}
.nowrap{white-space:nowrap;}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.big-num-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}

/* ============================================================

   ============================================================ */
@media (max-width:1099px){

    background:var(--canvas);border-bottom:1px solid var(--border);
    align-items:center;justify-content:space-between;gap:12px;padding:0 var(--gutter);
  }
  .main{margin-left:0;padding:calc(64px + 24px) var(--gutter) 96px;}
  .entry-main{grid-template-columns:1fr;}
  .entry-copy{border-right:0;border-bottom:1px solid var(--border);}
  .entry-map-wrap{padding:24px var(--gutter);}
  .work-grid{grid-template-columns:1fr;}
  .profile-grid{grid-template-columns:1fr;}
  .chat-layout{grid-template-columns:1fr;}
  .chat-list{max-height:220px;overflow:auto;}
  .bottomnav{display:flex;}
  .metric-band{grid-template-columns:1fr;}
}
@media (max-width:767px){
  :root{--gutter:16px;}
  .main{padding:calc(64px + 16px) var(--gutter) 96px;}
  .field-row{grid-template-columns:1fr;}
  .meta-grid{grid-template-columns:1fr;}
  .meta-grid .mg-item{
    flex-direction:row;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .oc-actions .btn{min-width:120px;}
  .drawer{width:100vw;}
  .toast-root{right:12px;left:12px;bottom:76px;max-width:none;}
  .chat-compose{flex-direction:column;align-items:stretch;}
  .chat-compose .btn{width:100%;}
  .msg{max-width:88%;}
  .entry-copy{padding:32px var(--gutter);}
  .reg-card{padding:16px;}
  .panel{padding:16px;}
  .eta-module .eta-side{text-align:left;}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;animation-iteration-count:1 !important;
    transition-duration:100ms !important;
  }
  .route-path-anim{stroke-dashoffset:0 !important;}
  .truck-marker{transition:none !important;}
}

function announce(text){
  var el = $('#live-region');
  if (el) el.textContent = text;
}
function toast(text, kind){
  var root = $('#toast-root');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (kind === 'ok' ? 't-ok' : kind === 'alert' ? 't-alert' : 't-live');
  el.innerHTML = '<div class="ts-text">' + esc(text) + '</div>';
  root.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transition = 'opacity 200ms ease';
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }, 4200);
}

function notify(userId, text, orderId){
  DB.notifications.unshift({
    id: uid('n'),
    userId: userId,
    text: text,
    orderId: orderId || null,
    ts: now(),

  });
  if (DB.notifications.length > 80) DB.notifications.length = 80;

    announce(text);
    render();
  }
}

var WORKSHOP_POINT = [760, 420];

function routeD(from){
  var to = WORKSHOP_POINT;
  var mx = (from[0] + to[0]) / 2;
  var my = (from[1] + to[1]) / 2;
  var dx = to[0] - from[0], dy = to[1] - from[1];
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var nx = -dy / len, ny = dx / len;
  var bow = Math.min(120, len * 0.22);
  var c1x = from[0] + dx * 0.3 + nx * bow, c1y = from[1] + dy * 0.3 + ny * bow;
  var c2x = mx + dx * 0.15 + nx * bow * 0.6, c2y = my + dy * 0.15 + ny * bow * 0.6;
  return 'M ' + from[0] + ' ' + from[1] + ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) +
    ', ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ', ' + to[0] + ' ' + to[1];
}

function cityGridSvg(){
  var g = '';
  var i;
  for (i = 0; i <= 10; i++) {
    var x = i * 100;
    g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="640" stroke="#20292A" stroke-width="' + (i % 5 === 0 ? 3 : 1) + '"/>';
  }
  for (i = 0; i <= 7; i++) {
    var y = i * 80;
    g += '<line x1="0" y1="' + y + '" x2="1000" y2="' + y + '" stroke="#20292A" stroke-width="' + (i % 4 === 0 ? 3 : 1) + '"/>';
  }
  /* blocks */
  var blocks = [
    [60, 40, 180, 120], [300, 60, 140, 90], [520, 30, 200, 110], [800, 60, 140, 100],
    [80, 240, 160, 100], [320, 220, 180, 120], [560, 200, 120, 140], [720, 240, 180, 90],
    [40, 440, 200, 120], [300, 420, 150, 100], [520, 440, 170, 110], [780, 380, 140, 120],
    [860, 520, 100, 80], [120, 560, 140, 60]
  ];
  blocks.forEach(function(b){
    g += '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" fill="#111516"/>';
  });
  /* diagonal avenue */
  g += '<path d="M 0 600 L 380 380 L 720 300 L 1000 120" stroke="#20292A" stroke-width="6" fill="none"/>';
  return g;
}

function nodeSquare(x, y, color, label, labelDx, labelDy){
  var s = '';
  s += '<rect x="' + (x - 9) + '" y="' + (y - 9) + '" width="18" height="18" fill="' + color + '"/>';
  if (label) {
    s += '<text x="' + (x + labelDx) + '" y="' + (y + labelDy) + '" fill="#9AA5A1" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">' + esc(label) + '</text>';
  }
  return s;
}
function nodeWorkshop(x, y, label){
  var s = '';
  s += '<rect x="' + (x - 11) + '" y="' + (y - 11) + '" width="22" height="22" fill="#0B0D0E" stroke="#F2EDE3" stroke-width="2.5"/>';
  s += '<rect x="' + (x - 5) + '" y="' + (y - 5) + '" width="10" height="10" fill="none" stroke="#FFB000" stroke-width="2"/>';
  if (label) {
    s += '<text x="' + (x + 18) + '" y="' + (y + 6) + '" fill="#F2EDE3" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">' + esc(label) + '</text>';
  }
  return s;
}

function buildMapSvg(opts){
  opts = opts || {};
  var w = 1000, h = 640;
  var s = '';
  s += '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.aria || 'Карта маршрута') + '">';
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#0F1414"/>';
  s += cityGridSvg();

  /* static routes (subtle) */
  (opts.ghostRoutes || []).forEach(function(d, idx){
    s += '<path d="' + d + '" stroke="' + (idx % 2 ? '#4EA1D3' : '#2C3737') + '" stroke-width="2" fill="none" stroke-dasharray="6 8" opacity="0.7"/>';
  });

  /* live route */
  if (opts.route) {
    var cls = 'route-path' + (opts.animate ? ' route-path-anim' : '');
    s += '<path id="' + esc(opts.routeId || 'route-main') + '" class="' + cls + '" d="' + opts.route + '"/>';
  }

  /* nodes */
  if (opts.pickup) {
    s += nodeSquare(opts.pickup[0], opts.pickup[1], '#F2EDE3', opts.pickupLabel || 'Погрузка', 16, 6);
  }
  if (opts.workshop !== false) {
    s += nodeWorkshop(WORKSHOP_POINT[0], WORKSHOP_POINT[1], opts.workshopLabel || 'Чистка');
  }
  if (opts.extraNodes) {
    opts.extraNodes.forEach(function(n){
      s += nodeSquare(n.x, n.y, n.color || '#66726F', n.label || '', 16, 6);
    });
  }

  /* truck marker */
  if (opts.truckId) {
    s += '<g id="' + esc(opts.truckId) + '" class="truck-marker" transform="translate(' +
      (opts.truckAt ? opts.truckAt[0] : WORKSHOP_POINT[0]) + ',' + (opts.truckAt ? opts.truckAt[1] : WORKSHOP_POINT[1]) + ')">';
    s += '<circle r="17" fill="#FFB000"/>';
    s += '<path d="M -7 -5 h 9 v 8 h -9 z M 2 -2 h 5 l 3 3 v 2 h -8 z" fill="#0B0D0E"/>';
    s += '<circle cx="-3.5" cy="4.5" r="1.8" fill="#0B0D0E"/><circle cx="5.5" cy="4.5" r="1.8" fill="#0B0D0E"/>';
    s += '<path d="M 26 0 h 14" stroke="#FFB000" stroke-width="3" stroke-linecap="round" opacity="0.85"/>';
    s += '<circle r="17" fill="none" stroke="#FFB000" stroke-width="1.5" opacity="0.8"><animate attributeName="r" values="17;30;17" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/></circle>';
    s += '</g>';
  }

  /* arrival pin */
  if (opts.arrival) {
    s += '<g transform="translate(' + opts.arrival[0] + ',' + opts.arrival[1] + ')">';
    s += '<circle r="6" fill="#59C98A"/>';
    s += '<text x="12" y="-12" fill="#59C98A" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">ПРИБЫТИЕ</text>';
    s += '</g>';
  }

  s += '</svg>';
  return s;
}

/* live map contexts for tick updates */
var activeMaps = [];

function mountLiveMaps(){
  activeMaps = [];
  $$('.js-map').forEach(function(host){
    var orderId = host.getAttribute('data-order');
    var o = orderId ? orderById(orderId) : null;
    var svg = host.querySelector('svg');
    if (!svg) return;
    var path = svg.querySelector('.route-path');
    var truck = svg.querySelector('.truck-marker');
    activeMaps.push({ host: host, order: o, path: path, truck: truck, pathLen: 0 });
    if (path && path.getTotalLength) {
      try {
        var len = path.getTotalLength();
        activeMaps[activeMaps.length - 1].pathLen = len;
        path.style.setProperty('--len', len);
        if (path.classList.contains('route-path-anim')) {
          /* restart draw */
          path.classList.remove('route-path-anim');
          void path.getBoundingClientRect();
          path.classList.add('route-path-anim');
        }
      } catch (e) {}
    }
    positionTrucks(false);
  });
}

function positionTrucks(animate){
  activeMaps.forEach(function(ctx){
    if (!ctx.path || !ctx.truck) return;
    var prog = 0;
    if (ctx.order && (ctx.order.state === 'accepted' || ctx.order.state === 'in_transit' || ctx.order.state === 'arrived' || ctx.order.state === 'done')) {
      prog = ctx.order.progress || 0;
    }
    prog = Math.max(0, Math.min(1, prog));
    try {
      var len = ctx.pathLen || ctx.path.getTotalLength();
      var pt = ctx.path.getPointAtLength(prog * len);
      if (!animate) ctx.truck.style.transition = 'none';
      ctx.truck.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')');
      if (!animate) {
        void ctx.truck.getBoundingClientRect();
        ctx.truck.style.transition = '';
      }
    } catch (e) {}
  });
}

  if (!focus) return '<div class="empty">' + icon('pin', 24) + '<div class="t-body">Активных маршрутов нет</div></div>';

  var from = focus.pickupPoint || [220, 200];
  var ghosts = active.filter(function(o){ return o.id !== focus.id; })
    .slice(0, 3).map(function(o){ return routeD(o.pickupPoint || [300, 300]); });

  var svg = buildMapSvg({
    route: routeD(from),
    routeId: 'route-overview',
    animate: false,
    pickup: from,
    pickupLabel: 'ПОГРУЗКА',
    workshopLabel: 'ЧИСТКА',
    aria: 'Обзорная карта активных маршрутов',
    ghostRoutes: ghosts,
    truckId: 'truck-overview',
    truckAt: from
  });

  return '<div class="map-frame">' +
    '<div class="map-head">' +
      '<div class="t-label t-label-amber">Смена на карте · ' + active.length + ' ' + plural(active.length, ['маршрут', 'маршрута', 'маршрутов']) + '</div>' +
    '</div>' +
    '<div class="map-svg-wrap js-map" data-order="' + esc(focus.id) + '">' + svg + '</div>' +
    '<div class="status-strip">' +
      '<span class="ss-live"><span class="pulse-dot"></span>' + esc(stateBadge(focus).text) + '</span>' +
      '<span class="muted">·</span>' +
      '<span class="t-data">' + esc(focus.id) + '</span>' +
      '<span class="muted">·</span>' +
      '<span class="t-data">' + focus.qty + ' ' + chickenWord(focus.qty) + '</span>' +
      '<span class="muted">·</span>' +
      '<span class="t-data">' + etaMinutes(focus) + ' мин</span>' +
    '</div>' +
  '</div>';
}

function stepperHtml(){

  var html = '<div class="stepper">';
  labels.forEach(function(l, i){

function recalcTotal(){
  var qtyInput = $('#no-qty'), priceInput = $('#no-price'), out = $('.js-total');
  if (!qtyInput || !priceInput || !out) return;
  var qty = parseInt(String(qtyInput.value).replace(/\D/g, ''), 10) || 0;
  var price = parseInt(String(priceInput.value).replace(/\D/g, ''), 10) || 0;
  out.textContent = money(qty * price);
}

function validatePhoneForm(digits){
  if (digits.length !== 11) return 'Введите номер полностью: +7 и 10 цифр.';
  if (digits.charAt(0) !== '7') return 'Номер должен начинаться с +7.';
  return '';
}

function handleAction(action, el, ev){
  var me = currentUser();

  switch (action) {
    case 'switch-mode':
      ui.mode = el.getAttribute('data-mode') || 'register';
      ui.reg.errors = {};
      ui.login.errors = {};
      render();
      break;

    case 'switch-role': {
      var role = el.getAttribute('data-role');
      if (me && me.roles.indexOf(role) >= 0) {
        me.role = role;
        persist();
        ui.view = 'orders';
        ui.chatOrderId = null;
        ui.newOrderOpen = false;
        render();
        toast('Роль переключена: ' + ROLE_LABEL[role], 'ok');
      } else {
        toast('Эта роль недоступна для профиля', 'alert');
      }
      break;
    }

    case 'nav':
      ui.view = el.getAttribute('data-view');
      ui.menuOpen = false;
      ui.drawerOpen = false;
      render();
      break;

    case 'toggle-menu':
      ui.menuOpen = !ui.menuOpen;
      render();
      break;

    case 'toggle-notif':
      ui.drawerOpen = !ui.drawerOpen;
      if (ui.drawerOpen) {
        myNotifications().forEach(function(n){ n.read = true; });
        persist();
      }
      render();
      break;

    case 'close-overlay':
      if (ev && ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-stop')) return;
      if (ev && el !== ev.target && ev.target.closest && ev.target.closest('[data-stop]')) return;
      ui.drawerOpen = false;
      ui.menuOpen = false;
      ui.dialog = null;
      render();
      break;

    case 'mark-read-all':
      myNotifications().forEach(function(n){ n.read = true; });
      persist();
      render();
      break;

    case 'clear-notif':
      DB.notifications = DB.notifications.filter(function(n){ return n.userId !== me.id; });
      persist();
      render();
      break;

    case 'open-order-from-notif': {
      var oid = el.getAttribute('data-order');
      ui.drawerOpen = false;
      ui.selectedOrderId = oid;
      ui.chatOrderId = oid;
      var o = orderById(oid);
      if (o && me.role === 'carrier' && o.carrierId === me.id) ui.view = 'map';
      else if (o && me.role === 'workshop') ui.view = 'orders';
      else ui.view = 'orders';
      render();
      break;
    }

    case 'resend-code':
      ui.reg.codeSent = String(Math.floor(1000 + Math.random() * 9000));
      toast('Код отправлен ещё раз: ' + ui.reg.codeSent, 'live');
      render();
      break;

    case 'reg-back':
      if (ui.reg.step === 2) ui.reg.step = 1;
      else if (ui.reg.step === 1) ui.reg.step = 0;
      else if (ui.reg.step === 3) ui.reg.step = 2;
      ui.reg.errors = {};
      render();
      break;

    case 'pick-role':
      ui.reg.role = el.getAttribute('data-role');
      ui.reg.errors.role = '';
      render();
      break;

    case 'finish-reg':
      finishRegistration();
      break;

    case 'toggle-new-order':
      ui.newOrderOpen = !ui.newOrderOpen;
      render();
      if (ui.newOrderOpen) {
        var f = $('#new-order-form');
        if (f) f.scrollIntoView({ block: 'nearest' });
      }
      break;

    case 'toggle-req': {
      var key = el.getAttribute('data-user');
      ui.showReq[key] = !ui.showReq[key];
      render();
      break;
    }

    case 'open-chat':
      ui.chatOrderId = el.getAttribute('data-order');
      ui.view = 'chat';
      ui.drawerOpen = false;
      render();
      break;

    case 'open-route':
      ui.selectedOrderId = el.getAttribute('data-order');
      ui.view = 'map';
      render();
      break;

    case 'accept-order':
      acceptCarrierOrder(el.getAttribute('data-order'));
      break;

    case 'decline-order': {
      var did = el.getAttribute('data-order');
      ui.dialog = {
        title: 'Отклонить заказ?',
        text: 'Заказ ' + did + ' останется у других перевозчиков. Клиент получит уведомление, что рейс вам не подходит.',
        kind: 'alert',
        confirmText: 'Не подходит',
        onConfirm: function(){
          toast('Заказ ' + did + ' пропущен', 'alert');
          ui.dialog = null;
          render();
        }
      };
      render();
      break;
    }

    case 'accept-workshop': {
      var wid = el.getAttribute('data-order');
      var wo = orderById(wid);
      if (!wo) break;
      wo.workshopStatus = 'accepted';
      persist();
      notify(wo.clientId, 'Цех принял заказ ' + wo.id + ': ' + wo.qty + ' ' + chickenWord(wo.qty) + '.', wo.id);
      if (wo.carrierId) notify(wo.carrierId, 'Цех «Чистка» принял заказ ' + wo.id + '. Везите по адресу: ' + ((userById(wo.workshopId) || {}).address || ''), wo.id);
      toast('Заказ ' + wo.id + ' принят в цех', 'ok');
      render();
      break;
    }

    case 'decline-workshop': {
      var xid = el.getAttribute('data-order');
      var xo = orderById(xid);
      if (!xo) break;
      ui.dialog = {
        title: 'Отклонить заказ в цех?',
        text: 'Клиент и перевозчик получат уведомление, что цех не примет партию ' + xo.qty + ' ' + chickenWord(xo.qty) + '.',
        kind: 'alert',
        confirmText: 'Отклонить',
        onConfirm: function(){
          xo.workshopStatus = 'declined';
          persist();
          notify(xo.clientId, 'Цех отклонил заказ ' + xo.id + '. Измените условия или свяжитесь с цехом.', xo.id);
          if (xo.carrierId) notify(xo.carrierId, 'Цех отклонил приёмку заказа ' + xo.id + '.', xo.id);
          toast('Заказ ' + xo.id + ' отклонён цехом', 'alert');
          ui.dialog = null;
          render();
        }
      };
      render();
      break;
    }

    case 'mark-delivered': {
      var mid = el.getAttribute('data-order');
      var mo = orderById(mid);
      if (!mo) break;
      mo.state = 'arrived';
      mo.progress = 1;
      persist();
      notify(mo.clientId, 'Маршрут ' + mo.id + ': перевозчик прибыл в цех.', mo.id);
      notify(mo.workshopId, 'Машина по заказу ' + mo.id + ' прибыла в цех: ' + mo.qty + ' ' + chickenWord(mo.qty) + '.', mo.id);
      toast('Прибытие отмечено по заказу ' + mo.id, 'ok');
      render();
      break;
    }

    case 'quick-price': {
      var qid = el.getAttribute('data-order');
      var qo = orderById(qid);
      if (!qo) break;
      var delta = parseInt(el.getAttribute('data-delta'), 10) || 0;
      if (delta !== 0) {
        var np = Math.max(1, qo.pricePer + delta);
        qo.pricePer = np;
        qo.total = orderTotal(qo);
        DB.messages.push({
          id: uid('m'), orderId: qo.id, from: me.id,
          text: 'Предлагаю цену ' + np + ' ₽ за курицу. Итого ' + money(orderTotal(qo)) + '.',
          ts: now(), priceChip: true
        });
        var other = counterpartFor(qo);
        if (other) notify(other.id, 'Новое предложение по цене в заказе ' + qo.id + ': ' + np + ' ₽ за курицу.', qo.id);
        toast('Предложение отправлено: ' + np + ' ₽ за курицу', 'live');
      } else {
        DB.messages.push({
          id: uid('m'), orderId: qo.id, from: me.id,
          text: 'Фиксирую цену: ' + qo.pricePer + ' ₽ за курицу, итого ' + money(orderTotal(qo)) + '.',
          ts: now(), priceChip: true
        });
        var other2 = counterpartFor(qo);
        if (other2) notify(other2.id, 'Цена зафиксирована в заказе ' + qo.id + ': ' + qo.pricePer + ' ₽ за курицу.', qo.id);
        toast('Цена зафиксирована: ' + qo.pricePer + ' ₽ / курица', 'ok');
      }
      persist();
      render();
      break;
    }

    case 'toggle-edit-profile':
      ui.editProfile = !ui.editProfile;
      render();
      break;

    case 'logout':
      DB.sessionUserId = null;
      persist();
      ui.view = 'orders';
      ui.chatOrderId = null;
      ui.newOrderOpen = false;
      ui.mode = 'login';
      ui.reg = { step: 0, phone: '', code: '', codeSent: null, name: '', bank: '', card: '', recipient: '', role: '', errors: {} };
      render();
      toast('Вы вышли из аккаунта', 'live');
      break;

    case 'dialog-confirm':
      if (ui.dialog && ui.dialog.onConfirm) ui.dialog.onConfirm();
      else { ui.dialog = null; render(); }
      break;

    default:
      break;
  }
}

function acceptCarrierOrder(orderId){
  var me = currentUser();
  var o = orderById(orderId);
  if (!o || !me) return;
  if (o.state !== 'awaiting_carrier') {
    toast('Заказ уже занят другим перевозчиком', 'alert');
    render();
    return;
  }
  o.carrierId = me.id;
  o.state = 'accepted';
  o.carrierStatus = 'accepted';
  o.acceptedAt = now();
  o.progress = 0;
  persist();

  notify(o.clientId, 'Перевозчик ' + me.name + ' принял заказ ' + o.id + ' (' + o.qty + ' ' + chickenWord(o.qty) + ', ' + money(o.pricePer) + ' за курицу).', o.id);
  notify(o.workshopId, 'Заказ ' + o.id + ' в пути: ' + o.qty + ' ' + chickenWord(o.qty) + ', перевозчик ' + me.name + ' (' + fmtPhone(me.phone) + ').', o.id);
  DB.messages.push({
    id: uid('m'), orderId: o.id, from: me.id,
    text: 'Принял заказ. Выезжаю на погрузку: ' + o.pickup + '.',
    ts: now(), priceChip: false
  });
  persist();

  ui.selectedOrderId = o.id;
  ui.view = 'map';
  toast('Заказ ' + o.id + ' принят. Маршрут построен.', 'ok');
  announce('Заказ ' + o.id + ' принят. Маршрут построен.');
  render();

  /* signature moment: draw route + lock ETA */
  setTimeout(function(){
    var wrap = $('.js-map[data-order="' + o.id + '"]');
    if (wrap) {
      var path = wrap.querySelector('.route-path');
      if (path) {
        path.classList.remove('route-path-anim');
        try { path.style.setProperty('--len', path.getTotalLength()); } catch (e) {}
        void path.getBoundingClientRect();
        path.classList.add('route-path-anim');
      }
    }
    $$('.eta-module').forEach(function(m){ m.classList.add('eta-locked'); });
    positionTrucks(true);
  }, 30);
}

function finishRegistration(){
  var r = ui.reg;
  r.errors = {};
  if (!r.name.trim()) r.errors.name = 'Укажите имя.';
  if (!r.bank.trim()) r.errors.bank = 'Укажите банк.';
  if (String(r.card).replace(/\D/g, '').length < 8) r.errors.card = 'Введите номер карты или счёта.';
  if (!r.recipient.trim()) r.errors.recipient = 'Укажите получателя.';
  if (!r.role) r.errors.role = 'Выберите роль.';
  if (Object.keys(r.errors).some(function(k){ return r.errors[k]; })) {
    render();
    return;
  }

  var user = {
    id: uid('u'),
    name: r.name.trim(),
    phone: fmtPhoneDigits(r.phone),
    bank: r.bank.trim(),
    card: String(r.card).replace(/\D/g, ''),
    recipient: r.recipient.trim(),
    role: r.role,
    roles: [r.role],
    address: r.role === 'workshop' ? 'Москва, ул. Братиславская, 18' : ''
  };

  DB.users.push(user);

  /* role-specific demo content so every workspace starts alive */
  if (user.role === 'client') {
    DB.orders.unshift({
      id: nextOrderId(), qty: 90, pricePer: 16, total: 1440,
      pickup: 'Москва, ул. Профсоюзная, 33', pickupPoint: [180 + Math.floor(Math.random() * 300), 160 + Math.floor(Math.random() * 260)],
      clientId: user.id, carrierId: null, workshopId: 'u3',
      state: 'awaiting_carrier', workshopStatus: 'pending', carrierStatus: 'pending',
      progress: 0, totalMin: 26, createdAt: now() - 1000 * 60 * 4,
      acceptedAt: null, comment: 'Позвонить за 20 минут до подачи.', deliveredAt: null
    });
    DB.orders.unshift({
      id: nextOrderId(), qty: 45, pricePer: 12, total: 540,
      pickup: 'Москва, ул. Академика Волгина, 6', pickupPoint: [420, 420],
      clientId: user.id, carrierId: 'u2', workshopId: 'u3',
      state: 'done', workshopStatus: 'accepted', carrierStatus: 'accepted',
      progress: 1, totalMin: 30, createdAt: now() - 1000 * 60 * 60 * 3,
      acceptedAt: now() - 1000 * 60 * 60 * 2, comment: '',
      deliveredAt: now() - 1000 * 60 * 70
    });
  }
  if (user.role === 'workshop') {
    /* this profile becomes the receiving цех for the demo logistics */
    DB.orders.forEach(function(o){
      if (o.state !== 'done') o.workshopId = user.id;
    });
    if (!user.address) user.address = 'Москва, ул. Братиславская, 18';
  }

  DB.sessionUserId = user.id;
  persist();

  /* welcome notifications */
  notify(user.id, 'Добро пожаловать в КУРОВОЗ! Роль: ' + ROLE_LABEL[user.role] + '.', null);
  if (user.role === 'client') {
    notify(user.id, 'Создайте заказ: укажите количество куриц и цену за 1 курицу перевозчику.', null);
    notify('u2', 'Новый клиент ' + user.name + ' зарегистрировался. Следите за заказами.', null);
  } else if (user.role === 'carrier') {
    notify(user.id, 'Вам доступны заказы клиентов. Уведомления о новых заявках уже включены.', null);
    notify('u2', 'Перевозчик ' + user.name + ' вышел на смену.', null);
  } else {
    notify(user.id, 'Цех готов принимать партии. Заказы клиентов появятся в списке.', null);
    notify('u3', 'Цех ' + user.name + ' появился в сети.', null);
  }
  persist();

  ui.reg = { step: 0, phone: '', code: '', codeSent: null, name: '', bank: '', card: '', recipient: '', role: '', errors: {} };
  ui.view = 'orders';
  render();
  toast('Профиль создан. Добро пожаловать!', 'ok');
}

/* ============================================================
   12. FORMS
   ============================================================ */
function fieldOf(form, name){
  var el = form.querySelector('[name="' + name + '"]');
  return el ? el : null;
}
function fv(form, name){
  var el = fieldOf(form, name);
  return el ? String(el.value == null ? '' : el.value) : '';
}

function handleSubmit(form, ev){
  ev.preventDefault();
  var kind = form.getAttribute('data-form');
  var me = currentUser();

  if (kind === 'login') {
    var lphone = fmtPhoneDigits(fv(form, 'phone'));
    var lerr = validatePhoneForm(lphone);
    if (lerr) { ui.login.errors.phone = lerr; ui.login.phone = lphone; render(); return; }
    var found = DB.users.filter(function(u){ return u.phone === lphone; })[0];
    if (!found) {
      ui.login.errors.phone = 'Профиль с таким номером не найден. Пройдите регистрацию.';
      ui.login.phone = lphone;
      render();
      return;
    }
    DB.sessionUserId = found.id;
    ui.login.errors = {};
    persist();
    ui.view = 'orders';
    render();
    toast('С возвращением, ' + found.name + '!', 'ok');
    return;
  }

  if (kind === 'reg-phone') {
    var phone = fmtPhoneDigits(fv(form, 'phone'));
    var err = validatePhoneForm(phone);
    if (err) {
      ui.reg.errors.phone = err;
      ui.reg.phone = phone;
      render();
      return;
    }
    ui.reg.phone = phone;
    ui.reg.errors = {};
    ui.reg.codeSent = String(Math.floor(1000 + Math.random() * 9000));
    ui.reg.step = 1;
    render();
    toast('Код отправлен на ' + fmtPhone(phone) + '. Демо-код: ' + ui.reg.codeSent, 'live');
    return;
  }

  if (kind === 'reg-code') {
    var code = fv(form, 'code').replace(/\D/g, '');
    if (code.length !== 4) {
      ui.reg.errors.code = 'Введите 4 цифры из SMS.';
      render();
      return;
    }
    if (code !== ui.reg.codeSent) {
      ui.reg.errors.code = 'Неверный код. Проверьте SMS или запросите новый.';
      render();
      return;
    }
    ui.reg.code = code;
    ui.reg.errors = {};
    ui.reg.step = 2;
    render();
    return;
  }

  if (kind === 'reg-profile') {
    var name = fv(form, 'name').trim();
    var bank = fv(form, 'bank').trim();
    var card = fv(form, 'card').replace(/\D/g, '');
    var recipient = fv(form, 'recipient').trim();
    ui.reg.name = name;
    ui.reg.bank = bank;
    ui.reg.card = card;
    ui.reg.recipient = recipient;
    ui.reg.errors = {};
    if (!name) ui.reg.errors.name = 'Укажите имя.';
    if (!bank) ui.reg.errors.bank = 'Укажите банк.';
    if (card.length < 8) ui.reg.errors.card = 'Введите номер карты или счёта.';
    if (!recipient) ui.reg.errors.recipient = 'Укажите получателя.';
    if (Object.keys(ui.reg.errors).some(function(k){ return ui.reg.errors[k]; })) {
      render();
      return;
    }
    ui.reg.step = 3;
    render();
    return;
  }

  if (kind === 'new-order') {
    var qty = parseInt(fv(form, 'qty').replace(/\D/g, ''), 10);
    var price = parseInt(fv(form, 'price').replace(/\D/g, ''), 10);
    var pickup = fv(form, 'pickup').trim();
    var workshopAddr = fv(form, 'workshop').trim();
    var comment = fv(form, 'comment').trim();

    form.querySelectorAll('.err').forEach(function(e){ e.textContent = ''; });
    var ok = true;
    function setErr(name, msg){
      var box = form.querySelector('[data-err="' + name + '"]');
      if (box) box.textContent = msg;
      ok = false;
    }
    if (!qty || qty < 1) setErr('qty', 'Укажите количество куриц.');
    if (!price || price < 1) setErr('price', 'Укажите цену за 1 курицу.');
    if (!pickup) setErr('pickup', 'Укажите адрес получения.');
    if (!workshopAddr) setErr('workshop', 'Укажите адрес чистки.');
    if (!ok) return;

    var order = {
      id: nextOrderId(),
      qty: qty,
      pricePer: price,
      total: qty * price,
      pickup: pickup,
      pickupPoint: [140 + Math.floor(Math.random() * 420), 120 + Math.floor(Math.random() * 320)],
      clientId: me.id,
      carrierId: null,
      workshopId: 'u3',
      state: 'awaiting_carrier',
      workshopStatus: 'pending',
      carrierStatus: 'pending',
      progress: 0,
      totalMin: 22 + Math.floor(Math.random() * 18),
      createdAt: now(),
      acceptedAt: null,
      comment: comment,
      deliveredAt: null
    };
    DB.orders.unshift(order);
    persist();

    /* notifications: carriers + workshop */
    DB.users.forEach(function(u){
      if (u.role === 'carrier' || (u.roles || []).indexOf('carrier') >= 0) {
        notify(u.id, 'Новый заказ ' + order.id + ': ' + order.qty + ' ' + chickenWord(order.qty) + ', ' + money(order.pricePer) + ' за курицу, итого ' + money(orderTotal(order)) + '.', order.id);
      }
      if (u.role === 'workshop' || (u.roles || []).indexOf('workshop') >= 0) {
        notify(u.id, 'Заказ ' + order.id + ': клиент ' + me.name + ' ожидает ' + order.qty + ' ' + chickenWord(order.qty) + '. Адрес погрузки: ' + order.pickup + '.', order.id);
      }
    });
    /* demo carrier + demo workshop always */
    if (userById('u2')) notify('u2', 'Новый заказ ' + order.id + ': ' + order.qty + ' ' + chickenWord(order.qty) + ', ' + money(order.pricePer) + ' за курицу, итого ' + money(orderTotal(order)) + '.', order.id);
    if (userById('u3')) notify('u3', 'Заказ ' + order.id + ': клиент ' + me.name + ' ожидает ' + order.qty + ' ' + chickenWord(order.qty) + '. Адрес погрузки: ' + order.pickup + '.', order.id);

    ui.newOrderOpen = false;
    ui.selectedOrderId = order.id;
    persist();
    render();
    toast('Заказ ' + order.id + ' отправлен перевозчикам и в цех', 'ok');
    announce('Заказ ' + order.id + ' создан и отправлен перевозчикам и в цех.');
    return;
  }

  if (kind === 'chat-send') {
    var text = fv(form, 'text').trim();
    if (!text || !ui.chatOrderId) return;
    DB.messages.push({
      id: uid('m'),
      orderId: ui.chatOrderId,
      from: me.id,
      text: text,
      ts: now(),
      priceChip: false
    });
    var ord = orderById(ui.chatOrderId);
    var other = ord ? counterpartFor(ord) : null;
    if (other) notify(other.id, 'Сообщение по заказу ' + ui.chatOrderId + ' от ' + me.name + '.', ui.chatOrderId);
    persist();
    render();
    return;
  }

  if (kind === 'edit-profile') {
    var newName = fv(form, 'name').trim();
    var newBank = fv(form, 'bank').trim();
    var newCard = fv(form, 'card').replace(/\D/g, '');
    var newRecipient = fv(form, 'recipient').trim();
    var newAddress = fv(form, 'address').trim();
    if (!newName || !newBank || newCard.length < 8 || !newRecipient) {
      toast('Заполните имя, банк, номер карты и получателя', 'alert');
      return;
    }
    me.name = newName;
    me.bank = newBank;
    me.card = newCard;
    me.recipient = newRecipient;
    me.address = newAddress;
    persist();
    ui.editProfile = false;
    render();
    toast('Профиль обновлён', 'ok');
    return;
  }
}

/* ============================================================
   13. INPUT HELPERS (phone / card masks)
   ============================================================ */
function onInput(e){
  var t = e.target;
  if (t.hasAttribute('data-phone')) {
    var pos = t.selectionStart;
    var oldLen = t.value.length;
    var digits = fmtPhoneDigits(t.value);
    t.value = fmtPhone(digits);
    var diff = t.value.length - oldLen;
    try { t.setSelectionRange(pos + diff, pos + diff); } catch (err) {}
    return;
  }
  if (t.hasAttribute('data-card')) {
    var d = t.value.replace(/\D/g, '').slice(0, 16);
    t.value = fmtCardFull(d);
    return;
  }
  if (t.classList && t.classList.contains('js-calc')) {
    recalcTotal();
    return;
  }
}

/* ============================================================
   14. EVENTS
   ============================================================ */
document.addEventListener('click', function(ev){
  if (!ev.target.closest) return;
  var el = ev.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  if (!action) return;
  ev.preventDefault();
  handleAction(action, el, ev);
});

document.addEventListener('submit', function(ev){
  var form = ev.target;
  if (form && form.getAttribute && form.getAttribute('data-form')) {
    handleSubmit(form, ev);
  }
});

document.addEventListener('input', function(ev){
  onInput(ev);
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape') {
    if (ui.drawerOpen || ui.menuOpen || ui.dialog) {
      ui.drawerOpen = false;
      ui.menuOpen = false;
      ui.dialog = null;
      render();
    }
  }
});

/* ============================================================
   15. SIMULATION TICK
   ============================================================ */
var tickCount = 0;
function tick(){
  tickCount++;
  var changed = false;

  DB.orders.forEach(function(o){
    if (o.state === 'accepted') {
      /* heading to pickup: small progress, then switch to in_transit */
      o.progress = (o.progress || 0) + 0.012;
      if (o.progress >= 0.22) {
        o.state = 'in_transit';
        o.progress = 0.22;
        changed = true;
        if (o.clientId) notify(o.clientId, 'Маршрут ' + o.id + ': перевозчик загрузил ' + o.qty + ' ' + chickenWord(o.qty) + ' и выехал в цех.', o.id);
        if (o.workshopId) notify(o.workshopId, 'Заказ ' + o.id + ' выехал в цех: ' + o.qty + ' ' + chickenWord(o.qty) + ', ожидаемое прибытие через ' + etaMinutes(o) + ' мин.', o.id);
      } else {
        changed = true;
      }
    } else if (o.state === 'in_transit') {
      o.progress = (o.progress || 0) + 0.018;
      if (o.progress >= 1) {
        o.progress = 1;
        o.state = 'arrived';
        changed = true;
        if (o.clientId) notify(o.clientId, 'Маршрут ' + o.id + ': машина прибыла в цех.', o.id);
        if (o.workshopId) notify(o.workshopId, 'Машина по заказу ' + o.id + ' прибыла: ' + o.qty + ' ' + chickenWord(o.qty) + ' к приёмке.', o.id);
        if (o.carrierId) notify(o.carrierId, 'Вы прибыли по заказу ' + o.id + '. Передайте партию цеху.', o.id);
      } else if (tickCount % 5 === 0) {
        changed = true;
      }
    } else if (o.state === 'arrived') {
      if ((o.arrivedAt || (o.arrivedAt = now())) && now() - o.arrivedAt > 1000 * 45) {
        o.state = 'done';
        o.deliveredAt = now();
        changed = true;
        if (o.clientId) notify(o.clientId, 'Заказ ' + o.id + ' завершён: ' + o.qty + ' ' + chickenWord(o.qty) + ' приняты цехом.', o.id);
      }
    }
  });

  persist();

  /* targeted live updates without full re-render */
  positionTrucks(true);
  $$('[data-eta-order]').forEach(function(node){
    var o = orderById(node.getAttribute('data-eta-order'));
    if (!o) return;
    var num = node.querySelector('.eta-num');
    if (num) num.textContent = etaMinutes(o) + ' мин';
    var side = node.querySelector('.es-val');
    if (side) side.textContent = fmtTime(now() + etaMinutes(o) * 60000);
  });

  /* occasional ambient notification for demo richness */
  if (tickCount === 12) {
    var me = currentUser();
    if (me && me.role === 'workshop') {
      notify(me.id, 'Напоминание: ближайшая машина будет в цеху в течение получаса.', null);
    }
  }

  if (changed && (tickCount % 4 === 0)) {
    /* refresh lists periodically so state stamps appear */
    render();
  }
}

/* ============================================================
   16. BOOT
   ============================================================ */
render();
setInterval(tick, 2500);

})();
</script>
